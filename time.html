<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos · 高精度时间</title>
    <style>
        :root {
            --bg: #08080c;
            --surface: #0f0f14;
            --surface-hover: #15151c;
            --text-primary: #e8e8ec;
            --text-secondary: #6b6b75;
            --text-tertiary: #44444d;
            --accent: #c7b299;
            --accent-dim: #c7b29940;
            --grid: #ffffff06;
            --border: #ffffff0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100%;
            overflow: hidden;
        }

        body {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景网格 */
        .grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* 顶部状态条 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 20px;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade8060;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 主时钟卡片 */
        .clock-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
        }

        .clock-card:hover {
            border-color: #ffffff15;
        }

        .clock-label {
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .main-time {
            font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
            font-size: clamp(36px, 10vw, 64px);
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 2px;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .main-time .ms {
            font-size: 0.45em;
            color: var(--accent);
            font-weight: 400;
            min-width: 2.5em;
            opacity: 0.9;
        }

        .main-time .sep {
            color: var(--text-tertiary);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .date-line {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            font-weight: 400;
        }

        .tz-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            padding: 4px 10px;
            background: var(--bg);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: "SF Mono", monospace;
            border: 1px solid var(--border);
        }

        /* 信息网格 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            margin-top: 2px;
        }

        .info-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px 20px;
            transition: background 0.2s ease;
        }

        .info-card:first-child {
            border-radius: 20px 0 0 0;
        }

        .info-card:nth-child(2) {
            border-radius: 0 20px 0 0;
        }

        .info-card:nth-child(3) {
            border-radius: 0 0 0 20px;
        }

        .info-card:nth-child(4) {
            border-radius: 0 0 20px 0;
        }

        .info-card:hover {
            background: var(--surface-hover);
        }

        .info-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .info-value {
            font-family: "SF Mono", monospace;
            font-size: 15px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
            word-break: break-all;
            line-height: 1.4;
        }

        .info-value.accent {
            color: var(--text-primary);
            font-size: 18px;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding-top: 32px;
            font-size: 11px;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
        }

        .footer span {
            color: var(--text-secondary);
        }

        /* 移动端优化 */
        @media (max-width: 520px) {
            .container {
                padding: 16px;
                gap: 1px;
            }

            .clock-card {
                padding: 28px 20px;
                border-radius: 16px;
            }

            .info-card {
                padding: 18px 14px;
            }

            .info-card:first-child { border-radius: 16px 0 0 0; }
            .info-card:nth-child(2) { border-radius: 0 16px 0 0; }
            .info-card:nth-child(3) { border-radius: 0 0 0 16px; }
            .info-card:nth-child(4) { border-radius: 0 0 16px 0; }

            .info-grid {
                gap: 1px;
            }

            .main-time {
                font-size: clamp(32px, 12vw, 48px);
            }

            .date-line {
                font-size: 13px;
            }
        }

        /* 防止选择 */
        .noselect {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    
    <div class="container noselect">
        <div class="status-bar">
            <div class="sync-indicator">
                <div class="sync-dot"></div>
                <span>实时同步</span>
            </div>
            <span id="resolution">1ms 精度</span>
        </div>

        <div class="clock-card">
            <div class="clock-label">本地时间</div>
            <div class="main-time" id="mainClock">
                <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span><span class="sep">:</span><span id="ss">00</span><span class="ms">.<span id="ms">000</span></span>
            </div>
            <div class="date-line" id="dateLine">载入中...</div>
            <div class="tz-badge" id="tzBadge">UTC+08:00</div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">UTC 时间</div>
                <div class="info-value accent" id="utcTime">--:--:--</div>
            </div>
            <div class="info-card">
                <div class="info-label">Unix 时间戳</div>
                <div class="info-value" id="unixTime">0</div>
            </div>
            <div class="info-card">
                <div class="info-label">ISO 8601</div>
                <div class="info-value" id="isoTime" style="font-size: 12px;">--</div>
            </div>
            <div class="info-card">
                <div class="info-label">星期 / 年积日</div>
                <div class="info-value" id="doyInfo">-- / --</div>
            </div>
        </div>

        <div class="footer">
            基于设备系统时钟 · <span id="perfRes">检测中...</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const els = {
                hh: document.getElementById('hh'),
                mm: document.getElementById('mm'),
                ss: document.getElementById('ss'),
                ms: document.getElementById('ms'),
                dateLine: document.getElementById('dateLine'),
                tzBadge: document.getElementById('tzBadge'),
                utcTime: document.getElementById('utcTime'),
                unixTime: document.getElementById('unixTime'),
                isoTime: document.getElementById('isoTime'),
                doyInfo: document.getElementById('doyInfo'),
                perfRes: document.getElementById('perfRes'),
                resolution: document.getElementById('resolution')
            };

            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            // 检测时间精度
            function detectPrecision() {
                const samples = [];
                for (let i = 0; i < 10; i++) {
                    const t0 = performance.now();
                    const t1 = performance.now();
                    samples.push(t1 - t0);
                }
                const minDelta = Math.min(...samples.filter(x => x > 0));
                if (minDelta < 1) {
                    els.perfRes.textContent = `高精度计时器 · ${(minDelta * 1000).toFixed(1)}μs 分辨率`;
                    els.resolution.textContent = 'μs 精度';
                } else {
                    els.perfRes.textContent = `标准计时器 · ${minDelta.toFixed(1)}ms 分辨率`;
                    els.resolution.textContent = `${Math.ceil(minDelta)}ms 精度`;
                }
            }

            function pad2(n) {
                return n.toString().padStart(2, '0');
            }

            function pad3(n) {
                return n.toString().padStart(3, '0');
            }

            function getDayOfYear(date) {
                const start = new Date(date.getFullYear(), 0, 0);
                const diff = date - start;
                return Math.floor(diff / (1000 * 60 * 60 * 24));
            }

            function update() {
                const now = new Date();
                const ms = now.getMilliseconds();
                
                // 主时钟
                els.hh.textContent = pad2(now.getHours());
                els.mm.textContent = pad2(now.getMinutes());
                els.ss.textContent = pad2(now.getSeconds());
                els.ms.textContent = pad3(ms);

                // 日期
                const dateStr = `${now.getFullYear()}年${pad2(now.getMonth() + 1)}月${pad2(now.getDate())}日`;
                els.dateLine.textContent = `${dateStr} · ${weekDays[now.getDay()]}`;

                // 时区
                const tzOffset = -now.getTimezoneOffset();
                const tzSign = tzOffset >= 0 ? '+' : '-';
                const tzH = pad2(Math.floor(Math.abs(tzOffset) / 60));
                const tzM = pad2(Math.abs(tzOffset) % 60);
                els.tzBadge.textContent = `UTC${tzSign}${tzH}:${tzM}`;

                // UTC
                els.utcTime.textContent = now.toISOString().slice(11, 19);

                // Unix 时间戳
                els.unixTime.textContent = Math.floor(now.getTime() / 1000).toString();

                // ISO
                els.isoTime.textContent = now.toISOString();

                // 年积日
                els.doyInfo.textContent = `${weekDays[now.getDay()]} / 第 ${getDayOfYear(now)} 天`;

                requestAnimationFrame(update);
            }

            detectPrecision();
            requestAnimationFrame(update);
        })();
    </script>
</body>
</html>
