<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyPilot FPV Simulator v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 动态网格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* 粒子画布 */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 扫描线效果 */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 200, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        /* 标题区域 */
        .title-area {
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border: 1px solid rgba(0, 255, 200, 0.4);
            color: #00ffc8;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: rgba(0, 255, 200, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; box-shadow: 0 0 10px rgba(0, 255, 200, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(0, 255, 200, 0.4); }
        }

        h1 {
            color: #fff;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 255, 200, 0.5);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .subtitle {
            color: #00ffc8;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 8px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffc8, transparent);
            margin: 0 auto 30px;
        }

        .desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* 无人机图标 */
        .drone-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .drone-body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(0, 255, 200, 0.2);
            border: 2px solid #00ffc8;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }

        .arm {
            position: absolute;
            background: rgba(0, 255, 200, 0.3);
            height: 2px;
        }

        .arm-tl { top: 35%; left: 20%; width: 25%; transform: rotate(-45deg); }
        .arm-tr { top: 35%; right: 20%; width: 25%; transform: rotate(45deg); }
        .arm-bl { bottom: 35%; left: 20%; width: 25%; transform: rotate(45deg); }
        .arm-br { bottom: 35%; right: 20%; width: 25%; transform: rotate(-45deg); }

        .propeller {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 255, 200, 0.6);
            border-radius: 50%;
            animation: spin 0.1s linear infinite;
        }

        .propeller::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 200, 0.8);
            transform: translate(-50%, -50%);
        }

        .prop-tl { top: 22%; left: 12%; }
        .prop-tr { top: 22%; right: 12%; }
        .prop-bl { bottom: 22%; left: 12%; }
        .prop-br { bottom: 22%; right: 12%; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 按钮 */
        .launch-btn {
            display: inline-block;
            padding: 18px 60px;
            background: rgba(0, 255, 200, 0.1);
            border: 1px solid rgba(0, 255, 200, 0.5);
            color: #00ffc8;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            text-decoration: none;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.2), transparent);
            transition: left 0.5s;
        }

        .launch-btn:hover::before {
            left: 100%;
        }

        .launch-btn:hover {
            background: rgba(0, 255, 200, 0.2);
            border-color: #00ffc8;
            box-shadow: 0 0 40px rgba(0, 255, 200, 0.3);
            transform: scale(1.05);
        }

        .launch-btn:active {
            transform: scale(0.98);
        }

        /* 底部信息 */
        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* 角落装饰 */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            z-index: 5;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* 响应式 */
        @media (max-width: 480px) {
            h1 { font-size: 28px; }
            .subtitle { font-size: 14px; letter-spacing: 4px; }
            .launch-btn { padding: 16px 40px; font-size: 16px; }
            .drone-icon { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <canvas id="particles"></canvas>
    <div class="scanline"></div>
    
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="container">
        <div class="title-area">
            <div class="badge">FPV SIMULATION SYSTEM</div>
            <div class="drone-icon">
                <div class="arm arm-tl"></div>
                <div class="arm arm-tr"></div>
                <div class="arm arm-bl"></div>
                <div class="arm arm-br"></div>
                <div class="propeller prop-tl"></div>
                <div class="propeller prop-tr"></div>
                <div class="propeller prop-bl"></div>
                <div class="propeller prop-br"></div>
                <div class="drone-body"></div>
            </div>
            <h1>SkyPilot</h1>
            <div class="subtitle">FPV SIMULATOR v2.0</div>
            <div class="divider"></div>
            <p class="desc">
                第一人称视角无人机飞行体验<br>
                自由飞行 / 战争模拟 / 3D地形 / 真实操控<br>
                支持双摇杆控制 · 多视角切换 · 粒子特效
            </p>
        </div>
        
        <a href="https://3jxxi7rntjhda.ok.kimi.link?sharetype=link" class="launch-btn">
            进入飞行
        </a>
    </div>

    <div class="footer">SKYPILOT FPV SYSTEM | READY FOR TAKEOFF</div>

    <script>
        // 粒子系统
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.life = Math.random() * 100 + 100;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
                
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 255, 200, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        // 创建粒子
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }
        
        // 连接线
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 255, 200, ${0.1 * (1 - dist / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            drawLines();
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
