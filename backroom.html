<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>后室 - The Backrooms | 完整版</title>
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        body { background: #000; overflow: hidden; touch-action: manipulation; font-family: 'Courier New', monospace; height: 100vh; height: 100dvh; width: 100vw; width: 100dvw; position: fixed; top: 0; left: 0; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: calc(40px + var(--safe-bottom)); left: 30px; width: 130px; height: 130px; pointer-events: auto; z-index: 20; }
        #joystick-base { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(200, 180, 120, 0.15); border: 2px solid rgba(200, 180, 120, 0.4); top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(180, 150, 80, 0.2); transition: border-color 0.3s; }
        #joystick-thumb { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(210, 185, 130, 0.5); border: 2px solid rgba(220, 200, 150, 0.7); top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(200, 170, 100, 0.4); transition: background 0.2s; }
        #joystick-thumb.active { background: rgba(230, 200, 140, 0.7); box-shadow: 0 0 25px rgba(220, 180, 100, 0.6); }
        #look-zone { position: absolute; bottom: calc(40px + var(--safe-bottom)); right: 30px; width: 100px; height: 100px; pointer-events: auto; z-index: 20; display: flex; align-items: center; justify-content: center; }
        #look-icon { width: 60px; height: 60px; border-radius: 50%; background: rgba(200, 180, 120, 0.1); border: 2px dashed rgba(200, 180, 120, 0.35); display: flex; align-items: center; justify-content: center; animation: pulse 3s ease-in-out infinite; transition: all 0.3s; }
        #look-icon svg { width: 30px; height: 30px; opacity: 0.6; transition: all 0.3s; }
        #look-icon.flashlight-on { background: rgba(230, 210, 140, 0.25); border-color: rgba(230, 210, 160, 0.8); box-shadow: 0 0 25px rgba(220, 180, 100, 0.5); animation: none; }
        #look-icon.flashlight-on svg { stroke: rgba(255, 240, 180, 0.95); opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 220, 100, 0.8)); }
        #look-icon.flashlight-on svg circle { fill: rgba(255, 240, 180, 0.9); }
        @keyframes pulse { 0%, 100% { border-color: rgba(200, 180, 120, 0.3); box-shadow: 0 0 10px rgba(180, 150, 80, 0.1); } 50% { border-color: rgba(220, 195, 140, 0.55); box-shadow: 0 0 20px rgba(200, 170, 90, 0.25); } }
        #info-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 15; text-align: center; display: none; }
        #level-tag { color: rgba(200, 180, 130, 0.7); font-size: 13px; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px rgba(180, 150, 80, 0.5); }
        #hint-text { color: rgba(190, 170, 130, 0.5); font-size: 10px; letter-spacing: 2px; margin-top: 4px; animation: fadeHint 4s ease-in-out infinite; }
        @keyframes fadeHint { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        #flicker-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: transparent; transition: background 0.05s; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #c8b87d; font-family: 'Courier New', monospace; }
        #loading-screen .loader-text { font-size: 18px; letter-spacing: 4px; animation: blink 1.5s ease-in-out infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        #tunnel-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 120px; }
        #door-hint { color: rgba(220, 200, 150, 0.95); font-size: 15px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(180, 150, 80, 0.9); pointer-events: none; cursor: default; background: rgba(0,0,0,0.5); padding: 14px 28px; border: 1px solid rgba(200, 180, 130, 0.5); border-radius: 4px; backdrop-filter: blur(4px); transition: all 0.3s; opacity: 0.3; transform: scale(0.95); }
        #door-hint.active { opacity: 1; pointer-events: auto; cursor: pointer; transform: scale(1); border-color: rgba(230, 210, 160, 0.9); box-shadow: 0 0 20px rgba(200, 170, 100, 0.4); animation: pulse 1.5s ease-in-out infinite; }
        #tunnel-title { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); color: rgba(200, 180, 130, 0.6); font-size: 12px; letter-spacing: 6px; text-transform: uppercase; }
        #signal-glitch { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.1s; overflow: hidden; }
        .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px); pointer-events: none; }
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%); pointer-events: none; }
        .rgb-split { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-shadow: inset 20px 0 40px rgba(255,0,0,0.1), inset -20px 0 40px rgba(0,255,255,0.1); pointer-events: none; opacity: 0; transition: opacity 0.1s; }
        #level-title { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); color: #ffffff; font-size: 28px; font-weight: bold; letter-spacing: 6px; text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(200,200,200,0.6), 0 0 80px rgba(255,255,255,0.3); z-index: 100; pointer-events: none; opacity: 0; transition: opacity 1.5s ease, transform 1.5s ease; font-family: 'Courier New', monospace; white-space: nowrap; text-align: center; }
        #level-title.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #minimap-container { position: fixed; top: 15px; left: 15px; width: 130px; height: 130px; z-index: 20; pointer-events: none; border: 1px solid rgba(200, 180, 130, 0.4); background: rgba(0, 0, 0, 0.5); border-radius: 4px; overflow: hidden; backdrop-filter: blur(2px); }
        #minimap { width: 100%; height: 100%; image-rendering: pixelated; }
        #time-display { position: fixed; top: 15px; right: 15px; z-index: 20; color: rgba(220, 210, 180, 0.9); font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 2px; background: rgba(0, 0, 0, 0.4); padding: 6px 12px; border: 1px solid rgba(200, 180, 130, 0.3); border-radius: 4px; backdrop-filter: blur(2px); pointer-events: none; }
        #fps-counter { position: fixed; bottom: 10px; right: 10px; color: rgba(200, 180, 130, 0.6); font-size: 10px; z-index: 30; font-family: monospace; pointer-events: none; }
        #backrooms-door-ui, #parking-door-ui, #pipe-door-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; display: none; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 120px; }
        .door-hint-style { color: rgba(220, 200, 150, 0.95); font-size: 15px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(180, 150, 80, 0.9); pointer-events: none; cursor: default; background: rgba(0,0,0,0.5); padding: 14px 28px; border: 1px solid rgba(200, 180, 130, 0.5); border-radius: 4px; backdrop-filter: blur(4px); transition: all 0.3s; opacity: 0.3; transform: scale(0.95); }
        .door-hint-style.active { opacity: 1; pointer-events: auto; cursor: pointer; transform: scale(1); border-color: rgba(230, 210, 160, 0.9); box-shadow: 0 0 20px rgba(200, 170, 100, 0.4); animation: pulse 1.5s ease-in-out infinite; }
        #danger-bar { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 25; width: 200px; height: 6px; background: rgba(255,0,0,0.2); border-radius: 3px; overflow: hidden; display: none; }
        #danger-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff0000); transition: width 0.3s; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        #danger-text { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 25; color: rgba(255,80,80,0.9); font-size: 11px; letter-spacing: 2px; display: none; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        #run-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; color: #ff0000; font-size: 32px; font-weight: bold; letter-spacing: 8px; text-shadow: 0 0 30px rgba(255,0,0,0.9); pointer-events: none; opacity: 0; transition: opacity 0.5s; font-family: 'Courier New', monospace; }
        #run-hint.visible { opacity: 1; }
        #ending-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #c8b87d; }
        #ending-screen .ending-title { font-size: 24px; letter-spacing: 6px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(200,180,130,0.5); }
        #ending-screen .ending-text { font-size: 14px; letter-spacing: 2px; color: rgba(200,180,130,0.7); margin-bottom: 40px; text-align: center; line-height: 2; }
        #ending-screen .restart-btn { padding: 12px 40px; border: 1px solid rgba(200,180,130,0.5); background: rgba(200,180,130,0.1); color: #c8b87d; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 3px; cursor: pointer; border-radius: 4px; transition: all 0.3s; }
        #ending-screen .restart-btn:hover { background: rgba(200,180,130,0.2); border-color: rgba(200,180,130,0.8); box-shadow: 0 0 20px rgba(200,180,130,0.3); }
        #entity-warning { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 25; color: rgba(255,50,50,0.9); font-size: 14px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,0,0,0.6); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        @media (max-width: 400px) { #joystick-zone { bottom: calc(25px + var(--safe-bottom)); left: 15px; width: 110px; height: 110px; } #joystick-base { width: 100px; height: 100px; } #joystick-thumb { width: 42px; height: 42px; } #look-zone { bottom: calc(25px + var(--safe-bottom)); right: 15px; width: 80px; height: 80px; } #look-icon { width: 48px; height: 48px; } #look-icon svg { width: 24px; height: 24px; } }
        @media (min-width: 768px) { #joystick-zone { bottom: calc(50px + var(--safe-bottom)); left: 50px; width: 150px; height: 150px; } #joystick-base { width: 140px; height: 140px; } #joystick-thumb { width: 56px; height: 56px; } #look-zone { bottom: calc(50px + var(--safe-bottom)); right: 50px; width: 120px; height: 120px; } #look-icon { width: 70px; height: 70px; } #look-icon svg { width: 35px; height: 35px; } }
    </style>
</head>
<body>
    <div id="loading-screen"><div class="loader-text">正在进入后室...</div></div>
    <div id="canvas-container"></div>
    <div id="tunnel-ui"><div id="tunnel-title">未知区域 · 隧道尽头</div><div id="door-hint">靠近门以开门</div></div>
    <div id="level-title">Level—0 &nbsp;&nbsp;教学关卡</div>
    <div id="minimap-container"><canvas id="minimap"></canvas></div>
    <div id="time-display">00:00:00</div>
    <div id="fps-counter">FPS: --</div>
    <div id="backrooms-door-ui"><div id="backrooms-door-hint" class="door-hint-style">靠近门以开门</div></div>
    <div id="parking-door-ui"><div id="parking-door-hint" class="door-hint-style">找到出口门</div></div>
    <div id="pipe-door-ui"><div id="pipe-door-hint" class="door-hint-style">找到通风口</div></div>
    <div id="danger-bar"><div id="danger-fill"></div></div>
    <div id="danger-text">实体接近中</div>
    <div id="entity-warning">⚠ 检测到实体活动</div>
    <div id="run-hint">跑！</div>
    <div id="ending-screen">
        <div class="ending-title">你 逃 出 来 了</div>
        <div class="ending-text">你成功穿越了后室的层层迷宫<br>从黄色的无尽走廊到红色的死亡跑道<br>你活了下来...</div>
        <button class="restart-btn" onclick="location.reload()">重新开始</button>
    </div>
    <div id="signal-glitch"><div class="scanlines"></div><div class="vignette"></div><div class="rgb-split" id="rgb-split"></div></div>
    <div id="overlay">
        <div id="info-bar"><div id="level-tag">后室 · Level 0</div><div id="hint-text">左摇杆移动 · 右滑视角</div></div>
        <div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-thumb"></div></div>
        <div id="look-zone">
            <div id="look-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(200,180,130,0.7)" stroke-width="1.5">
                    <path d="M6 3h12v9H6z"/><path d="M12 12v3"/><path d="M9 15h6"/>
                    <circle cx="12" cy="7.5" r="1.5" fill="rgba(200,180,130,0.4)" stroke="none"/>
                </svg>
            </div>
        </div>
    </div>
    <div id="flicker-overlay"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>

    const CONFIG = {
        textureSize: 1024, dustCount: 100, postScale: 0.75, maxPixelRatio: 2.0,
        collisionRadius: 0.35, cellSize: 2.8, gridSize: 20
    };

    let currentPhase = 'tunnel';
    let renderer, postScene, postCamera, postMaterial, renderTarget;
    let joystickTouchId = null, lookTouchId = null;
    let joystickDelta = { x: 0, z: 0 }, lookDelta = { x: 0, y: 0 };
    let lastLookX = 0, lastLookY = 0, keys = {}, mouseLookActive = false;
    let joystickCenterX = 0, joystickCenterY = 0, joystickMaxRadius = 50;
    let lookZoneTouchStart = { x: 0, y: 0, time: 0, id: null, isClick: false };
    let flashlightSystem = null;
    let audioCtx = null, humStarted = false, audioNodes = {};
    let container = document.getElementById('canvas-container');
    let flickerOverlay = document.getElementById('flicker-overlay');
    let activeTouches = new Map();
    let scenes = {}, cameras = {}, clocks = {}, players = {}, levelData = {};

    const perfMonitor = {
        frames: 0, lastTime: performance.now(), fps: 60, lowPerfMode: false,
        tick: function() {
            this.frames++;
            const now = performance.now();
            if (now >= this.lastTime + 1000) {
                this.fps = Math.round(this.frames * 1000 / (now - this.lastTime));
                this.frames = 0; this.lastTime = now;
                document.getElementById('fps-counter').textContent = 'FPS: ' + this.fps;
                if (this.fps < 30 && !this.lowPerfMode) { this.lowPerfMode = true; setPostScale(0.5); }
                else if (this.fps > 45 && this.lowPerfMode) { this.lowPerfMode = false; setPostScale(0.75); }
            }
        }
    };

    function updateJoystickCenter() {
        const rect = document.getElementById('joystick-base').getBoundingClientRect();
        joystickCenterX = rect.left + rect.width / 2;
        joystickCenterY = rect.top + rect.height / 2;
        joystickMaxRadius = rect.width / 2 - 10;
    }

    function getTouchZone(tx, ty) {
        const jRect = document.getElementById('joystick-zone').getBoundingClientRect();
        if (tx >= jRect.left && tx <= jRect.right && ty >= jRect.top && ty <= jRect.bottom) return 'joystick';
        const lRect = document.getElementById('look-zone').getBoundingClientRect();
        if (tx >= lRect.left && tx <= lRect.right && ty >= lRect.top && ty <= lRect.bottom) return 'look';
        return tx < window.innerWidth / 2 ? 'joystick' : 'look';
    }

    document.addEventListener('touchstart', (e) => {
        if (e.target.closest('.door-hint-style')) return;
        e.preventDefault();
        updateJoystickCenter();
        for (const touch of e.changedTouches) {
            const zone = getTouchZone(touch.clientX, touch.clientY);
            const touchId = touch.identifier;
            if (zone === 'joystick' && !Array.from(activeTouches.values()).some(t => t.zone === 'joystick')) {
                activeTouches.set(touchId, { zone: 'joystick', startX: touch.clientX, startY: touch.clientY });
                joystickTouchId = touchId;
                document.getElementById('joystick-thumb').classList.add('active');
            } else if (zone === 'look' && !Array.from(activeTouches.values()).some(t => t.zone === 'look')) {
                activeTouches.set(touchId, { zone: 'look', startX: touch.clientX, startY: touch.clientY });
                lookTouchId = touchId;
                lookZoneTouchStart = { x: touch.clientX, y: touch.clientY, time: Date.now(), id: touchId, isClick: true };
                lastLookX = touch.clientX; lastLookY = touch.clientY;
                lookDelta = { x: 0, y: 0 };
            }
        }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        if (e.target.closest('.door-hint-style')) return;
        e.preventDefault();
        for (const touch of e.changedTouches) {
            const touchId = touch.identifier;
            const touchData = activeTouches.get(touchId);
            if (!touchData) continue;
            if (touchData.zone === 'joystick' && touchId === joystickTouchId) {
                const dx = touch.clientX - joystickCenterX, dy = touch.clientY - joystickCenterY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const clampedDist = Math.min(dist, joystickMaxRadius);
                const angle = Math.atan2(dy, dx);
                const cdx = Math.cos(angle) * clampedDist, cdy = Math.sin(angle) * clampedDist;
                joystickDelta.x = cdx / joystickMaxRadius;
                joystickDelta.z = -cdy / joystickMaxRadius;
                document.getElementById('joystick-thumb').style.transform = `translate(calc(-50% + ${cdx}px), calc(-50% + ${cdy}px))`;
            }
            if (touchData.zone === 'look' && touchId === lookTouchId) {
                if (lookZoneTouchStart.isClick && touchId === lookZoneTouchStart.id) {
                    const dx = touch.clientX - lookZoneTouchStart.x, dy = touch.clientY - lookZoneTouchStart.y;
                    if (Math.sqrt(dx*dx + dy*dy) > 20) lookZoneTouchStart.isClick = false;
                }
                lookDelta.x = touch.clientX - lastLookX;
                lookDelta.y = touch.clientY - lastLookY;
                lastLookX = touch.clientX; lastLookY = touch.clientY;
            }
        }
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
        for (const touch of e.changedTouches) {
            const touchId = touch.identifier;
            const touchData = activeTouches.get(touchId);
            if (!touchData) continue;
            if (touchData.zone === 'joystick' && touchId === joystickTouchId) {
                joystickTouchId = null; joystickDelta.x = 0; joystickDelta.z = 0;
                document.getElementById('joystick-thumb').classList.remove('active');
                document.getElementById('joystick-thumb').style.transform = 'translate(-50%, -50%)';
            }
            if (touchData.zone === 'look' && touchId === lookTouchId) {
                if (touchId === lookZoneTouchStart.id && lookZoneTouchStart.isClick) {
                    if (Date.now() - lookZoneTouchStart.time < 250 && flashlightSystem) flashlightSystem.toggle();
                }
                lookTouchId = null; lookDelta.x = 0; lookDelta.y = 0; lookZoneTouchStart.isClick = false;
            }
            activeTouches.delete(touchId);
        }
    });

    document.addEventListener('touchcancel', (e) => {
        for (const touch of e.changedTouches) {
            const touchId = touch.identifier;
            const touchData = activeTouches.get(touchId);
            if (!touchData) continue;
            if (touchData.zone === 'joystick' && touchId === joystickTouchId) {
                joystickTouchId = null; joystickDelta.x = 0; joystickDelta.z = 0;
                document.getElementById('joystick-thumb').classList.remove('active');
                document.getElementById('joystick-thumb').style.transform = 'translate(-50%, -50%)';
            }
            if (touchData.zone === 'look' && touchId === lookTouchId) {
                lookTouchId = null; lookDelta.x = 0; lookDelta.y = 0; lookZoneTouchStart.isClick = false;
            }
            activeTouches.delete(touchId);
        }
    });

    document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0 && getTouchZone(e.clientX, e.clientY) === 'look') {
            const lzRect = document.getElementById('look-zone').getBoundingClientRect();
            if (e.clientX >= lzRect.left && e.clientX <= lzRect.right && e.clientY >= lzRect.top && e.clientY <= lzRect.bottom) return;
            mouseLookActive = true; lastLookX = e.clientX; lastLookY = e.clientY;
        }
    });
    document.addEventListener('mousemove', (e) => {
        if (mouseLookActive) { lookDelta.x = e.clientX - lastLookX; lookDelta.y = e.clientY - lastLookY; lastLookX = e.clientX; lastLookY = e.clientY; }
    });
    document.addEventListener('mouseup', () => { mouseLookActive = false; lookDelta.x = 0; lookDelta.y = 0; });
    document.getElementById('look-zone').addEventListener('click', (e) => { e.stopPropagation(); if (flashlightSystem) flashlightSystem.toggle(); });
    window.addEventListener('resize', updateJoystickCenter);
    window.addEventListener('orientationchange', () => setTimeout(updateJoystickCenter, 300));

    function initAudio() {
        if (humStarted) return;
        try {
            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.04; masterGain.connect(audioCtx.destination);
            const osc1 = audioCtx.createOscillator(); osc1.type = 'sawtooth'; osc1.frequency.value = 118;
            const gain1 = audioCtx.createGain(); gain1.gain.value = 0.03; osc1.connect(gain1); gain1.connect(masterGain);
            const osc2 = audioCtx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 236;
            const gain2 = audioCtx.createGain(); gain2.gain.value = 0.015; osc2.connect(gain2); gain2.connect(masterGain);
            const osc3 = audioCtx.createOscillator(); osc3.type = 'sine'; osc3.frequency.value = 55;
            const gain3 = audioCtx.createGain(); gain3.gain.value = 0.02; osc3.connect(gain3); gain3.connect(masterGain);
            osc1.start(); osc2.start(); osc3.start(); humStarted = true;
            audioNodes = { ctx: audioCtx, osc1, osc2, osc3, gain1, gain2, gain3, masterGain };
        } catch(e) { console.log('音频初始化失败:', e); }
    }
    function updateAudio(time) {
        if (!humStarted || !audioNodes.ctx) return;
        const now = Math.floor(time * 10);
        if (audioNodes._last === now) return; audioNodes._last = now;
        const wobble = Math.sin(time * 0.7) * 1.5 + Math.sin(time * 1.3) * 1.0;
        audioNodes.osc1.frequency.setValueAtTime(118 + wobble, audioNodes.ctx.currentTime);
        const gw = 1 + Math.sin(time * 0.4) * 0.15 + Math.sin(time * 1.1) * 0.08;
        audioNodes.gain1.gain.setValueAtTime(0.03 * gw, audioNodes.ctx.currentTime);
    }
    function playAlertSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function initPostProcessing(w, h) {
        const scale = CONFIG.postScale;
        const rw = Math.floor(w * scale), rh = Math.floor(h * scale);
        if (renderTarget) renderTarget.dispose();
        renderTarget = new THREE.WebGLRenderTarget(rw, rh, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
        if (!postScene) {
            postScene = new THREE.Scene();
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postMaterial = new THREE.ShaderMaterial({
                uniforms: { tDiffuse: { value: renderTarget.texture }, uTime: { value: 0 }, uDistortion: { value: 0.0 }, uFlicker: { value: 0.0 }, uRGBShift: { value: 0.0 } },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
                fragmentShader: `
                    precision mediump float;
                    uniform sampler2D tDiffuse; uniform float uTime, uDistortion, uFlicker, uRGBShift;
                    varying vec2 vUv;
                    float rand(vec2 co) { return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }
                    void main() {
                        vec2 uv = vUv;
                        float jitter = uFlicker * 0.01;
                        uv += (vec2(rand(uv+uTime), rand(uv+uTime+1.0)) - 0.5) * jitter;
                        float shift = uRGBShift * 0.015;
                        float r = texture2D(tDiffuse, uv + vec2(shift, 0.0)).r;
                        float g = texture2D(tDiffuse, uv).g;
                        float b = texture2D(tDiffuse, uv - vec2(shift, 0.0)).b;
                        vec3 color = vec3(r, g, b);
                        float scanline = sin(uv.y * 400.0 + uTime * 6.0) * 0.03 * uFlicker;
                        color -= scanline;
                        float bar = step(0.96, rand(vec2(floor(uTime*4.0), floor(uv.y*15.0))));
                        color += bar * 0.1 * uFlicker;
                        float noise = rand(uv * uTime * 15.0) * 0.08 * uFlicker;
                        color += noise;
                        float flicker = 1.0 - uFlicker * 0.15 * (sin(uTime*15.0)*0.5+0.5);
                        color *= flicker;
                        gl_FragColor = vec4(color, 1.0);
                    }`
            });
            postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));
        } else { postMaterial.uniforms.tDiffuse.value = renderTarget.texture; }
    }

    function createNoiseTexture(baseColor, noiseAmt, spots) {
        const size = CONFIG.textureSize;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = baseColor; ctx.fillRect(0, 0, size, size);
        const imgData = ctx.getImageData(0, 0, size, size);
        for (let i = 0; i < imgData.data.length; i += 4) {
            const n = (Math.random() - 0.5) * noiseAmt;
            imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + n));
            imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + n));
            imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + n));
        }
        ctx.putImageData(imgData, 0, 0);
        for (let s = 0; s < spots; s++) {
            const x = Math.random() * size, y = Math.random() * size, r = 15 + Math.random() * 50;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, 'rgba(35,35,35,0.3)'); g.addColorStop(1, 'rgba(100,100,100,0)');
            ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.colorSpace = THREE.SRGBColorSpace; tex.generateMipmaps = true;

    function tryOpenDoor() {
        if (isDoorOpen || currentPhase !== 'tunnel') return;
        const dist = Math.sqrt((tunnelPlayer.x - DOOR_POS.x)**2 + (tunnelPlayer.z - DOOR_POS.z)**2);
        if (dist >= 2.5) return;
        isDoorOpen = true;
        doorAnimStartPos = { x: tunnelPlayer.x, y: tunnelPlayer.y, z: tunnelPlayer.z, yaw: tunnelPlayer.yaw, pitch: tunnelPlayer.pitch };
        doorOpenTime = clocks.tunnel.getElapsedTime();
        document.getElementById('door-hint').classList.remove('active');
        document.getElementById('door-hint').style.opacity = '0';
    }

    document.getElementById('door-hint').addEventListener('click', (e) => { e.stopPropagation(); tryOpenDoor(); });
    document.getElementById('door-hint').addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); tryOpenDoor(); }, { passive: false });
    document.addEventListener('click', (e) => { if (currentPhase === 'tunnel' && !isDoorOpen && !e.target.closest('#door-hint')) tryOpenDoor(); });

    function updateFalling(delta, time) {
        const duration = 2.8, t = Math.min(time / duration, 1.0), easeIn = t*t*(3-2*t);
        tunnelCamera.position.y = 6.0 - easeIn * (6.0 - 1.6);
        tunnelCamera.position.z = -10 - easeIn * 2;
        const shake = (1.0 - t) * 0.25 + 0.05;
        tunnelCamera.position.x = Math.sin(time * 9.0) * shake * 0.4;
        tunnelCamera.rotation.z = Math.sin(time * 7.0) * shake * 0.6;
        tunnelCamera.rotation.x = Math.sin(time * 5.0) * shake * 0.3 - 0.2 * t;
        let distortion, flicker;
        if (t < 0.25) { distortion = (t/0.25)*0.9; flicker = (t/0.25); }
        else if (t < 0.75) { distortion = 0.9 + Math.sin(time*3.0)*0.15; flicker = 1.0; }
        else { distortion = ((1.0-t)/0.25)*0.9; flicker = ((1.0-t)/0.25); }
        postMaterial.uniforms.uDistortion.value = distortion;
        postMaterial.uniforms.uRGBShift.value = distortion * 1.2;
        postMaterial.uniforms.uFlicker.value = flicker;
        container.style.filter = 'blur('+Math.sin(t*Math.PI)*3+'px) brightness('+(1.0+Math.sin(t*Math.PI)*0.3)+')';
        if (t >= 1.0) shouldTransition = true;
    }

    function animateTunnel() {
        if (currentPhase !== 'tunnel' && currentPhase !== 'falling') return;
        requestAnimationFrame(animateTunnel);
        if (document.hidden) return;
        const delta = Math.min(clocks.tunnel.getDelta(), 0.1);
        const time = clocks.tunnel.getElapsedTime();

        if (currentPhase === 'tunnel' && !isDoorOpen) {
            let moveX = joystickDelta.x, moveZ = joystickDelta.z;
            if (keys['w'] || keys['arrowup']) moveZ = Math.max(moveZ, 0.85);
            if (keys['s'] || keys['arrowdown']) moveZ = Math.min(moveZ, -0.7);
            if (keys['a'] || keys['arrowleft']) moveX = Math.min(moveX, -0.8);
            if (keys['d'] || keys['arrowright']) moveX = Math.max(moveX, 0.8);
            const mag = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (mag > 1.0) { moveX /= mag; moveZ /= mag; }

            if (lookDelta.x !== 0 || lookDelta.y !== 0) {
                tunnelPlayer.yaw -= lookDelta.x * 0.003;
                tunnelPlayer.pitch -= lookDelta.y * 0.0025;
                tunnelPlayer.pitch = Math.max(-0.55, Math.min(0.4, tunnelPlayer.pitch));
                lookDelta.x = 0; lookDelta.y = 0;
            }
            const fx = -Math.sin(tunnelPlayer.yaw), fz = -Math.cos(tunnelPlayer.yaw);
            const rx = Math.cos(tunnelPlayer.yaw), rz = -Math.sin(tunnelPlayer.yaw);
            const speed = 3.2 * (mag > 0.7 ? 1.0 : (mag > 0.08 ? 0.6 : 0));
            tunnelPlayer.x += (fx * moveZ + rx * moveX) * speed * delta;
            tunnelPlayer.z += (fz * moveZ + rz * moveX) * speed * delta;
            tunnelPlayer.x = Math.max(-TUNNEL_W_HALF, Math.min(TUNNEL_W_HALF, tunnelPlayer.x));
            tunnelPlayer.z = Math.max(TUNNEL_Z_END, Math.min(TUNNEL_Z_START, tunnelPlayer.z));
            tunnelCamera.position.set(tunnelPlayer.x, tunnelPlayer.y, tunnelPlayer.z);
            tunnelCamera.rotation.y = tunnelPlayer.yaw;
            tunnelCamera.rotation.x = tunnelPlayer.pitch;

            const dist = Math.sqrt((tunnelPlayer.x - DOOR_POS.x)**2 + (tunnelPlayer.z - DOOR_POS.z)**2);
            const hint = document.getElementById('door-hint');
            if (dist < 2.5) { hint.textContent = '点击开门'; hint.classList.add('active'); }
            else { hint.textContent = '靠近门以开门'; hint.classList.remove('active'); }
        }

        if (isDoorOpen && !isFalling) {
            const dp = Math.min((time - doorOpenTime) / 1.2, 1.0);
            leftDoorGroup.rotation.y = dp * Math.PI / 2.2;
            rightDoorGroup.rotation.y = -dp * Math.PI / 2.2;
            if (dp > 0.2 && doorAnimStartPos) {
                const mp = Math.min((time - doorOpenTime - 0.2) / 1.8, 1.0);
                const ease = mp*mp*(3-2*mp);
                tunnelCamera.position.x = doorAnimStartPos.x * (1-ease);
                tunnelCamera.position.y = doorAnimStartPos.y + Math.sin(ease*Math.PI)*0.15;
                tunnelCamera.position.z = doorAnimStartPos.z * (1-ease) + (-10.5)*ease;
                tunnelCamera.rotation.y = doorAnimStartPos.yaw * (1-ease);
                tunnelCamera.rotation.x = doorAnimStartPos.pitch * (1-ease) + (-0.2)*ease;
            }
            if (dp >= 1.0 && tunnelCamera.position.z <= -9.0) startFalling();
        }

        if (isFalling) { fallTime += delta; updateFalling(delta, fallTime); }
        if (shouldTransition) { transitionToLevel0(); return; }

        renderer.setRenderTarget(renderTarget); renderer.render(tunnelScene, tunnelCamera); renderer.setRenderTarget(null);
        postMaterial.uniforms.uTime.value = time;
        renderer.render(postScene, postCamera);
        perfMonitor.tick();
    }

    // ==================== Level 0（后室迷宫）====================
    let level0Data = { mapGrid: [], wallMesh: null, lightMesh: null, lightData: [], dust: null, intro: { active: true, time: 0 }, door: null, doorPos: {x:0,z:0}, doorOpen: false, doorOpenTime: 0 };

    function transitionToLevel0() {
        currentPhase = 'level0';
        isFalling = false; shouldTransition = false;
        container.style.filter = 'none';

    }

    function generateMap() {
        const G = CONFIG.gridSize;
        const grid = Array.from({length:G}, () => Array(G).fill(1));
        const visited = Array.from({length:G}, () => Array(G).fill(false));
        const stack = [];
        const startR = Math.floor(G/2), startC = Math.floor(G/2);
        function valid(r,c) { return r>=1 && r<G-1 && c>=1 && c<G-1; }
        function carve(r,c) {
            grid[r][c] = 0; visited[r][c] = true; stack.push({r,c});
            while (stack.length > 0) {
                const cur = stack[stack.length-1];
                const neighbors = [];
                const dirs = [{dr:-2,dc:0},{dr:2,dc:0},{dr:0,dc:-2},{dr:0,dc:2}];
                for (const d of dirs) {
                    const nr = cur.r+d.dr, nc = cur.c+d.dc;
                    if (valid(nr,nc) && !visited[nr][nc]) neighbors.push({r:nr,c:nc,mr:cur.r+d.dr/2,mc:cur.c+d.dc/2});
                }
                if (neighbors.length > 0) {
                    const ch = neighbors[Math.floor(Math.random()*neighbors.length)];
                    grid[ch.mr][ch.mc] = 0; grid[ch.r][ch.c] = 0;
                    visited[ch.r][ch.c] = true; visited[ch.mr][ch.mc] = true;
                    stack.push({r:ch.r,c:ch.c});
                } else stack.pop();
            }
        }
        carve(startR, startC);
        const extra = Math.floor(G*G*0.06);
        for (let i=0; i<extra; i++) {
            const r = 1+Math.floor(Math.random()*(G-2)), c = 1+Math.floor(Math.random()*(G-2));
            if (grid[r][c] === 1) {
                let adj = 0; const dirs = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
                for (const d of dirs) { const ar=r+d.dr, ac=c+d.dc; if (valid(ar,ac) && grid[ar][ac]===0) adj++; }
                if (adj >= 2) grid[r][c] = 0;
            }
        }
        for (let r=0; r<G; r++) { grid[r][0]=1; grid[r][G-1]=1; }
        for (let c=0; c<G; c++) { grid[0][c]=1; grid[G-1][c]=1; }
        grid[startR][startC] = 0; grid[startR][startC+1] = 0; grid[startR+1][startC] = 0;
        return grid;
    }

        for (let i=0; i<CONFIG.dustCount; i++) {
            dPos[i*3] = (Math.random()-0.5)*G*CS*0.8;
            dPos[i*3+1] = 0.3 + Math.random()*(WH-0.5);
            dPos[i*3+2] = (Math.random()-0.5)*G*CS*0.8;
        }
        dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
        const dMat = new THREE.PointsMaterial({ color: '#d8cfb0', size: 0.03, transparent: true, opacity: 0.5, depthWrite: false, sizeAttenuation: true });
        const dust = new THREE.Points(dGeo, dMat); scene.add(dust); level0Data.dust = dust;

        players.level0 = { position: new THREE.Vector3(0, 1.6, 0), yaw: 0, pitch: 0, velocityX: 0, velocityZ: 0, moveSpeed: 3.2, collisionRadius: 0.35, isMoving: false };
        const startR = Math.floor(G/2), startC = Math.floor(G/2);
        players.level0.position.x = startC*CS-OFF+CS/2;
        players.level0.position.z = startR*CS-OFF+CS/2;
        players.level0.yaw = Math.random() * Math.PI * 2;
        camera.position.copy(players.level0.position);
        camera.rotation.y = players.level0.yaw; camera.rotation.x = players.level0.pitch;

        let attempts = 0, dr, dc;
        const startX = startC*CS-OFF+CS/2, startZ = startR*CS-OFF+CS/2;
        do {
            dr = Math.floor(Math.random()*G); dc = Math.floor(Math.random()*G);
            attempts++;
        } while ((grid[dr][dc] !== 0 || Math.sqrt((dc*CS-OFF+CS/2-startX)**2 + (dr*CS-OFF+CS/2-startZ)**2) < 20) && attempts < 500);
        level0Data.doorPos = { x: dc*CS-OFF+CS/2, z: dr*CS-OFF+CS/2, r: dr, c: dc };
        const doorObj = createDoorMesh();
        doorObj.group.position.set(level0Data.doorPos.x, 0, level0Data.doorPos.z);
        scene.add(doorObj.group);
        level0Data.door = doorObj;

        clocks.level0 = new THREE.Clock();
        level0Data.intro = { active: true, time: 0 };
        animateLevel0();
    }

    function checkCollisionL0(x, z) {
        const r = players.level0.collisionRadius;
        const G = CONFIG.gridSize, CS = CONFIG.cellSize, OFF = (G*CS)/2;
        const gx = Math.floor((x+OFF)/CS), gz = Math.floor((z+OFF)/CS);
        const dirs = [[0,0],[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dgr, dgc] of dirs) {
            const rIdx = gz+dgr, cIdx = gx+dgc;
            if (rIdx>=0 && rIdx<G && cIdx>=0 && cIdx<G && level0Data.mapGrid[rIdx][cIdx] === 1) {
                const wx = cIdx*CS-OFF+CS/2, wz = rIdx*CS-OFF+CS/2;
                const hc = CS*0.49;
                const cx = Math.max(wx-hc, Math.min(x, wx+hc));
                const cz = Math.max(wz-hc, Math.min(z, wz+hc));
                if ((x-cx)**2 + (z-cz)**2 < r*r) return true;
            }
        }
        return false;
    }

    function resolveMoveL0(dx, dz) {
        const cx = players.level0.position.x, cz = players.level0.position.z;
        if (!checkCollisionL0(dx, dz)) return {x:dx, z:dz};
        if (!checkCollisionL0(dx, cz)) return {x:dx, z:cz};
        if (!checkCollisionL0(cx, dz)) return {x:cx, z:dz};
        return {x:cx, z:cz};
    }

    let minimapSkip = 0;
    function updateMinimap() {
        minimapSkip++; if (minimapSkip % 3 !== 0) return;
        const cvs = document.getElementById('minimap'), ctx = cvs.getContext('2d');
        const size = 130; cvs.width = size; cvs.height = size;
        const G = CONFIG.gridSize, CS = CONFIG.cellSize, OFF = (G*CS)/2;
        const cellSize = size / 15;
        const px = Math.floor((players.level0.position.x + OFF) / CS);
        const pz = Math.floor((players.level0.position.z + OFF) / CS);
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, size, size);
        const range = 7;
        for (let r=-range; r<=range; r++) {
            for (let c=-range; c<=range; c++) {
                const gr = pz+r, gc = px+c;
                if (gr>=0 && gr<G && gc>=0 && gc<G) {
                    const sx = size/2 + c*cellSize, sy = size/2 + r*cellSize;
                    ctx.fillStyle = level0Data.mapGrid[gr][gc] === 1 ? '#4a4030' : '#c8b87d';
                    ctx.fillRect(sx, sy, cellSize-0.5, cellSize-0.5);
                }
            }
        }
        const dpx = level0Data.doorPos.c, dpz = level0Data.doorPos.r;
        const ddx = dpx - px, ddz = dpz - pz;
        if (Math.abs(ddx) <= range && Math.abs(ddz) <= range) {
            ctx.fillStyle = '#00ff00'; ctx.beginPath();
            ctx.arc(size/2+ddx*cellSize+cellSize/2, size/2+ddz*cellSize+cellSize/2, 3, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.fillStyle = '#ff4444'; ctx.beginPath();
        ctx.arc(size/2, size/2, 3, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(size/2, size/2);
        ctx.lineTo(size/2 + Math.sin(players.level0.yaw)*6, size/2 + Math.cos(players.level0.yaw)*6); ctx.stroke();
    }

    let flickerTimer = 0, nextFlicker = 3+Math.random()*8, globalFlicker = 1.0, flickerSkip = 0;
    function updateLights(delta, time) {
        flickerTimer += delta;
        if (flickerTimer > nextFlicker) {
            flickerTimer = 0; nextFlicker = 2+Math.random()*10;
            const strength = 0.3+Math.random()*0.6, duration = 0.05+Math.random()*0.2;
            globalFlicker = 1.0 - strength;
            setTimeout(() => { globalFlicker = Math.min(1.0, globalFlicker + strength*0.8); }, duration*1000);
            setTimeout(() => { globalFlicker = 1.0; }, duration*2500);
            flickerOverlay.style.background = 'rgba(0,0,0,'+(strength*0.3)+')';
            setTimeout(() => { flickerOverlay.style.background = 'rgba(0,0,0,0.05)'; }, duration*1000);
            setTimeout(() => { flickerOverlay.style.background = 'transparent'; }, duration*2500);
        }
        flickerSkip++;
        if (flickerSkip % 3 === 0) {
            for (const ld of level0Data.lightData) {
                if (ld.type === 'flicker') {
                    ld.flickerTimer += delta * ld.flickerSpeed;
                    const fv = 0.5 + 0.5 * Math.sin(ld.flickerTimer*3.7) * Math.sin(ld.flickerTimer*7.1) * Math.sin(ld.flickerTimer*1.3+1.7);
                    const inten = 0.6 + fv * ld.flickerIntensity;
                    level0Data.lightMesh.setColorAt(ld.index, new THREE.Color('#ffffff').multiplyScalar(Math.max(0.2, inten)));
                }
            }
            level0Data.lightMesh.instanceColor.needsUpdate = true;
        }
    }

    function animateLevel0() {
        if (currentPhase !== 'level0') return;
        requestAnimationFrame(animateLevel0);
        if (document.hidden) return;
        const delta = Math.min(clocks.level0.getDelta(), 0.1);
        const time = clocks.level0.getElapsedTime();
        const player = players.level0;
        const camera = cameras.level0;
        const scene = scenes.level0;

        if (level0Data.intro.active) {
            level0Data.intro.time += delta;
            const t = level0Data.intro.time;
            if (t < 1.5) {
                const p = t/1.5, ease = p*p;
                camera.position.set(player.position.x + Math.sin(p*2.5)*0.6, 6.5*(1-ease)+0.25*ease, player.position.z + 1.5*(1-p));
                camera.rotation.y = player.yaw; camera.rotation.x = -0.7+p*0.3+Math.sin(p*8)*0.08; camera.rotation.z = Math.sin(p*6)*0.15;
            } else if (t < 2.0) {
                const p = (t-1.5)/0.5;
                camera.position.y = 0.25 + Math.sin(p*Math.PI*5)*0.06;
                camera.rotation.x = -0.4 + Math.sin(p*Math.PI*8)*0.12; camera.rotation.z = Math.sin(p*Math.PI*6)*0.08;
                postMaterial.uniforms.uFlicker.value = 0.6;
                flickerOverlay.style.background = 'rgba(0,0,0,'+(0.2+Math.sin(p*Math.PI*6)*0.15)+')';
            } else if (t < 4.5) {
                const p = (t-2.0)/2.5, ease = 1-Math.pow(1-p, 3);
                camera.position.set(player.position.x + Math.sin(t*2.2)*0.035*(1-p), 0.25+ease*1.35, player.position.z);
                camera.rotation.x = -0.4 + ease*0.4; camera.rotation.z = Math.sin(t*3.5)*0.025*(1-p); camera.rotation.y = player.yaw;
                flickerOverlay.style.background = 'transparent';
            } else {
                level0Data.intro.active = false;
                camera.position.copy(player.position); camera.rotation.x = player.pitch; camera.rotation.z = 0;
                showTitle('Level—0');
            }
            updateLights(delta, time);
            if (level0Data.dust) {
                const dp = level0Data.dust.geometry.attributes.position.array;
                for (let i=0; i<CONFIG.dustCount; i++) {
                    dp[i*3+1] += Math.sin(time*0.5+i*0.7)*0.003;
                    dp[i*3] += Math.cos(time*0.4+i*0.9)*0.002;
                    dp[i*3+2] += Math.sin(time*0.45+i*0.6)*0.002;
                    if (dp[i*3+1] > 2.7) dp[i*3+1] = 0.3; if (dp[i*3+1] < 0.2) dp[i*3+1] = 2.7;
                }
                level0Data.dust.geometry.attributes.position.needsUpdate = true;
            }
            renderer.setRenderTarget(renderTarget); renderer.render(scene, camera); renderer.setRenderTarget(null);
            postMaterial.uniforms.uTime.value = time;
            const breathe = Math.sin(time*0.35)*0.02;
            const introDistort = t < 2.0 ? 0.08 : 0;
            postMaterial.uniforms.uDistortion.value = 0.06 + breathe + introDistort;
            postMaterial.uniforms.uRGBShift.value = (0.06+breathe)*0.8;
            postMaterial.uniforms.uFlicker.value = (t>=1.5 && t<2.0) ? 0.6 : (0.06+Math.sin(time*0.8)*0.04+Math.sin(time*2.1)*0.02);
            renderer.render(postScene, postCamera);
            perfMonitor.tick(); return;
        }

        let moveX = joystickDelta.x, moveZ = joystickDelta.z;
        if (keys['w'] || keys['arrowup']) moveZ = Math.max(moveZ, 0.85);
        if (keys['s'] || keys['arrowdown']) moveZ = Math.min(moveZ, -0.7);
        if (keys['a'] || keys['arrowleft']) moveX = Math.min(moveX, -0.8);
        if (keys['d'] || keys['arrowright']) moveX = Math.max(moveX, 0.8);
        const mag = Math.sqrt(moveX*moveX + moveZ*moveZ);
        if (mag > 1.0) { moveX /= mag; moveZ /= mag; }
        const isMoving = mag > 0.08; player.isMoving = isMoving;

        if (lookDelta.x !== 0 || lookDelta.y !== 0) {
            player.yaw -= lookDelta.x * 0.003; player.pitch -= lookDelta.y * 0.0025;
            player.pitch = Math.max(-0.55, Math.min(0.4, player.pitch));
            lookDelta.x = 0; lookDelta.y = 0;
        }
        if (!mouseLookActive && lookTouchId === null) { lookDelta.x *= 0.85; lookDelta.y *= 0.85; if (Math.abs(lookDelta.x) < 0.01) lookDelta.x = 0; if (Math.abs(lookDelta.y) < 0.01) lookDelta.y = 0; }

        const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
        const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
        const speed = player.moveSpeed * (isMoving ? (mag > 0.7 ? 1.0 : 0.6) : 0);
        const desiredX = player.position.x + (fx*moveZ + rx*moveX) * speed * delta;
        const desiredZ = player.position.z + (fz*moveZ + rz*moveX) * speed * delta;
        const resolved = resolveMoveL0(desiredX, desiredZ);
        player.position.x = resolved.x; player.position.z = resolved.z;
        const mapHalf = (CONFIG.gridSize*CONFIG.cellSize)/2 - CONFIG.cellSize*0.6;
        player.position.x = Math.max(-mapHalf, Math.min(mapHalf, player.position.x));
        player.position.z = Math.max(-mapHalf, Math.min(mapHalf, player.position.z));

        camera.position.copy(player.position); camera.rotation.y = player.yaw; camera.rotation.x = player.pitch; camera.rotation.z = 0;
        if (isMoving) {
            const wt = time * 9;
            camera.position.y += Math.sin(wt)*0.015;
            camera.rotation.z = Math.sin(wt*0.5)*0.006;
            camera.rotation.x = player.pitch + Math.sin(wt*0.7)*0.003;
        }

    function animateParking() {

        const delta = Math.min(clocks.parking.getDelta(), 0.1);
        const time = clocks.parking.getElapsedTime();
        const player = players.parking;

        let moveX = joystickDelta.x, moveZ = joystickDelta.z;
        if (keys['w'] || keys['arrowup']) moveZ = Math.max(moveZ, 0.85);
        if (keys['s'] || keys['arrowdown']) moveZ = Math.min(moveZ, -0.7);
        if (keys['a'] || keys['arrowleft']) moveX = Math.min(moveX, -0.8);
        if (keys['d'] || keys['arrowright']) moveX = Math.max(moveX, 0.8);
        const mag = Math.sqrt(moveX*moveX + moveZ*moveZ);
        if (mag > 1.0) { moveX /= mag; moveZ /= mag; }

        if (lookDelta.x !== 0 || lookDelta.y !== 0) {
            player.yaw -= lookDelta.x * 0.003; player.pitch -= lookDelta.y * 0.0025;
            player.pitch = Math.max(-0.55, Math.min(0.4, player.pitch));
            lookDelta.x = 0; lookDelta.y = 0;
        }

        player.position.z += (fz*moveZ + rz*moveX) * speed * delta;
        const limit = 38;
        player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
        player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            camera.rotation.z = Math.sin(wt*0.5)*0.006;

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7, metalness: 0.1, color: '#cccccc' }));
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        // 超亮天花板
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ color: '#dddddd', roughness: 0.8 }));
        ceil.rotation.x = Math.PI/2; ceil.position.y = H; scene.add(ceil);
        // 超亮墙壁
        const wallMat = new THREE.MeshStandardMaterial({ color: '#bbbbbb', roughness: 0.6, metalness: 0.2 });
        const lw1 = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat); lw1.rotation.y = Math.PI/2; lw1.position.set(-W/2, H/2, 0); scene.add(lw1);
        const lw2 = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat); lw2.rotation.y = -Math.PI/2; lw2.position.set(W/2, H/2, 0); scene.add(lw2);

        // 管道保持原样但稍亮
        const pipeMat = new THREE.MeshStandardMaterial({ color: '#888888', metalness: 0.7, roughness: 0.4 });
        for (let i=0; i<8; i++) {
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, L, 16), pipeMat);
            pipe.rotation.x = Math.PI/2;
            pipe.position.set(-W/2 + 0.3 + i*0.4, 0.3 + Math.random()*0.5, 0); scene.add(pipe);
        }
        for (let i=0; i<5; i++) {
            const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, L, 16), pipeMat);
            pipe.rotation.x = Math.PI/2;
            pipe.position.set((Math.random()-0.5)*W*0.6, H-0.3, 0); scene.add(pipe);
        }

        // 超亮灯光系统
        for (let z=-L/2+3; z<L/2; z+=8) {
            const light = new THREE.PointLight('#ffffff', 30, 25, 1.0);
            light.position.set(0, H-0.2, z); scene.add(light);
            const fixture = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.2), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
            fixture.position.set(0, H-0.05, z); scene.add(fixture);
        }
        // 超强环境光
        scene.add(new THREE.AmbientLight('#ffffff', 2.5));
        // 额外半球光
        scene.add(new THREE.HemisphereLight('#ffffff', '#888888', 1.0));

        const entityGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.8, 8), new THREE.MeshStandardMaterial({ color: '#0a0a0a', roughness: 0.9 }));
        body.position.y = 0.9; entityGroup.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshStandardMaterial({ color: '#0a0a0a', roughness: 0.9 }));
        head.position.y = 1.9; entityGroup.add(head);
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: '#ff0000' }));
        eyeL.position.set(-0.08, 1.95, 0.2); entityGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: '#ff0000' }));
        eyeR.position.set(0.08, 1.95, 0.2); entityGroup.add(eyeR);
        entityGroup.position.set(0, 0, -L/2 + 5);
        scene.add(entityGroup);
        pipeData.entity = entityGroup;
        pipeData.entityPos = { x: 0, z: -L/2 + 5 };

        pipeData.entityPath = [];
        for (let i=0; i<10; i++) {
            pipeData.entityPath.push({
                x: (Math.random()-0.5) * W * 0.6,
                z: -L/2 + 5 + Math.random() * (L - 10)
            });
        }
        pipeData.entityTarget = 0;

        pipeData.doorPos = { x: 0, z: L/2 - 2 };
        const ventGroup = new THREE.Group();
        ventGroup.position.set(0, 1.5, L/2 - 0.1);
        const ventFrame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 0.1), new THREE.MeshStandardMaterial({ color: '#666666', metalness: 0.5 }));
        ventGroup.add(ventFrame);
        for (let i=-0.6; i<=0.6; i+=0.2) {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.9, 0.05), new THREE.MeshStandardMaterial({ color: '#444444' }));
            bar.position.set(i, 0, 0.05); ventGroup.add(bar);
        }
        const ventLight = new THREE.PointLight('#00ff00', 8, 8, 1);
        ventLight.position.set(0, 0, -0.5); ventGroup.add(ventLight);
        scene.add(ventGroup);
        pipeData.pipeDoor = ventGroup;

        players.pipe = { position: new THREE.Vector3(0, 1.6, -L/2 + 2), yaw: 0, pitch: 0 };
        camera.position.copy(players.pipe.position);
        camera.rotation.y = players.pipe.yaw; camera.rotation.x = players.pipe.pitch;

        document.getElementById('pipe-door-ui').style.display = 'flex';
        document.getElementById('info-bar').style.display = 'block';
        document.getElementById('level-tag').textContent = '后室 · Level 2';

        clocks.pipe = new THREE.Clock();
        showTitle('Level—2');
        animatePipe();
    }
    function animatePipe() {
        if (currentPhase !== 'pipe') return;
        requestAnimationFrame(animatePipe);
        if (document.hidden) return;
        const delta = Math.min(clocks.pipe.getDelta(), 0.1);
        const time = clocks.pipe.getElapsedTime();
        const player = players.pipe;
        const camera = cameras.pipe;

        let moveX = joystickDelta.x, moveZ = joystickDelta.z;
        if (keys['w'] || keys['arrowup']) moveZ = Math.max(moveZ, 0.85);
        if (keys['s'] || keys['arrowdown']) moveZ = Math.min(moveZ, -0.7);
        if (keys['a'] || keys['arrowleft']) moveX = Math.min(moveX, -0.8);
        if (keys['d'] || keys['arrowright']) moveX = Math.max(moveX, 0.8);
        const mag = Math.sqrt(moveX*moveX + moveZ*moveZ);
        if (mag > 1.0) { moveX /= mag; moveZ /= mag; }

        if (lookDelta.x !== 0 || lookDelta.y !== 0) {
            player.yaw -= lookDelta.x * 0.003; player.pitch -= lookDelta.y * 0.0025;
            player.pitch = Math.max(-0.55, Math.min(0.4, player.pitch));
            lookDelta.x = 0; lookDelta.y = 0;
        }
        if (!mouseLookActive && lookTouchId === null) { lookDelta.x *= 0.85; lookDelta.y *= 0.85; if (Math.abs(lookDelta.x) < 0.01) lookDelta.x = 0; if (Math.abs(lookDelta.y) < 0.01) lookDelta.y = 0; }

        const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
        const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
        const speed = 3.2 * (mag > 0.7 ? 1.0 : (mag > 0.08 ? 0.6 : 0));
        player.position.x += (fx*moveZ + rx*moveX) * speed * delta;
        player.position.z += (fz*moveZ + rz*moveX) * speed * delta;
        player.position.x = Math.max(-1.8, Math.min(1.8, player.position.x));
        player.position.z = Math.max(-29, Math.min(29, player.position.z));

        camera.position.copy(player.position); camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;
        if (mag > 0.08) {
            const wt = time * 9;
            camera.position.y += Math.sin(wt)*0.015;
            camera.rotation.z = Math.sin(wt*0.5)*0.006;
        }

        if (pipeData.entity) {
            const target = pipeData.entityPath[pipeData.entityTarget];
            const edx = target.x - pipeData.entityPos.x;
            const edz = target.z - pipeData.entityPos.z;
            const edist = Math.sqrt(edx*edx + edz*edz);
            const espeed = 1.5 * delta;
            if (edist < 0.5) {
                pipeData.entityTarget = (pipeData.entityTarget + 1) % pipeData.entityPath.length;
            } else {
                pipeData.entityPos.x += (edx/edist) * espeed;
                pipeData.entityPos.z += (edz/edist) * espeed;
            }
            pipeData.entity.position.set(pipeData.entityPos.x, 0, pipeData.entityPos.z);
            pipeData.entity.lookAt(player.position.x, 1.6, player.position.z);

            const pdx = pipeData.entityPos.x - player.position.x;
            const pdz = pipeData.entityPos.z - player.position.z;
            const pdist = Math.sqrt(pdx*pdx + pdz*pdz);
            const danger = Math.max(0, 1 - pdist/10);
            pipeData.danger = danger;
            document.getElementById('danger-fill').style.width = (danger*100) + '%';
            const warn = document.getElementById('entity-warning');
            if (danger > 0.5) { warn.style.opacity = '1'; playAlertSound(); }
            else warn.style.opacity = '0';

            if (pdist < 1.5) {
                postMaterial.uniforms.uDistortion.value = 0.8;
                postMaterial.uniforms.uFlicker.value = 1.0;
                player.position.set(0, 1.6, -28);
                player.yaw = 0;
                flickerOverlay.style.background = 'rgba(255,0,0,0.3)';
                setTimeout(() => { flickerOverlay.style.background = 'transparent'; }, 500);
            }
        }

        if (!pipeData.doorOpen) {
            const vdx = pipeData.doorPos.x - player.position.x;
            const vdz = pipeData.doorPos.z - player.position.z;
            const vdist = Math.sqrt(vdx*vdx + vdz*vdz);
            const hint = document.getElementById('pipe-door-hint');
            if (vdist < 2.0) { hint.textContent = '点击进入通风口'; hint.classList.add('active'); }
            else { hint.textContent = '找到通风口'; hint.classList.remove('active'); }
        }
        if (pipeData.doorOpen) {
            const dp = Math.min((performance.now()/1000 - pipeData.doorOpenTime) / 1.0, 1.0);
            if (pipeData.pipeDoor) pipeData.pipeDoor.scale.set(1-dp*0.3, 1-dp*0.3, 1);
            if (dp >= 1.0) { transitionToRun(); return; }
        }

        renderer.setRenderTarget(renderTarget); renderer.render(scenes.pipe, camera); renderer.setRenderTarget(null);
        postMaterial.uniforms.uTime.value = time;
        // 大幅降低故障效果，保持高亮度
        const baseDistort = 0.02 + pipeData.danger * 0.1;
        postMaterial.uniforms.uDistortion.value = baseDistort;
        postMaterial.uniforms.uRGBShift.value = baseDistort * 0.5;
        postMaterial.uniforms.uFlicker.value = 0.02 + pipeData.danger * 0.1;
        renderer.render(postScene, postCamera);
        perfMonitor.tick();
    }
    document.getElementById('pipe-door-hint').addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentPhase === 'pipe' && !pipeData.doorOpen) {
            const p = players.pipe;
            const dx = pipeData.doorPos.x - p.position.x;
            const dz = pipeData.doorPos.z - p.position.z;
            if (Math.sqrt(dx*dx+dz*dz) < 2.0) { pipeData.doorOpen = true; pipeData.doorOpenTime = performance.now()/1000; }
        }
    });

    // ==================== Level !（红色走廊跑酷）====================
    let runData = { time: 0, distance: 0, totalDistance: 80, autoRun: true, endDoor: null };
    function transitionToRun() {
        currentPhase = 'run';
        document.getElementById('pipe-door-ui').style.display = 'none';
        document.getElementById('danger-bar').style.display = 'none';
        document.getElementById('danger-text').style.display = 'none';
        document.getElementById('entity-warning').style.display = 'none';
        document.getElementById('run-hint').classList.add('visible');
        setTimeout(() => document.getElementById('run-hint').classList.remove('visible'), 2000);
        initRun();
    }
    function initRun() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a0000');
        scene.fog = new THREE.FogExp2('#1a0000', 0.015);
        scenes.run = scene;
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 50);
        camera.rotation.order = 'YXZ';
        cameras.run = camera;

        const W = 5, H = 3.5, L = 100;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ color: '#330000', roughness: 0.8, metalness: 0.1 }));
        floor.rotation.x = -Math.PI/2; scene.add(floor);
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ color: '#220000', roughness: 0.9 }));
        ceil.rotation.x = Math.PI/2; ceil.position.y = H; scene.add(ceil);
        const wallMat = new THREE.MeshStandardMaterial({ color: '#440000', roughness: 0.7, metalness: 0.2 });
        const lw1 = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat); lw1.rotation.y = Math.PI/2; lw1.position.set(-W/2, H/2, 0); scene.add(lw1);
        const lw2 = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat); lw2.rotation.y = -Math.PI/2; lw2.position.set(W/2, H/2, 0); scene.add(lw2);

        for (let z=-L/2+5; z<L/2; z+=10) {
            const light = new THREE.PointLight('#ff0000', 15, 10, 1.5);
            light.position.set(0, H-0.3, z); scene.add(light);
            const fixture = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.15), new THREE.MeshBasicMaterial({ color: '#ff3333' }));
            fixture.position.set(0, H-0.05, z); scene.add(fixture);
        }
        scene.add(new THREE.AmbientLight('#330000', 0.6));

        const endDoor = createDoorMesh();
        endDoor.group.position.set(0, 0, L/2 - 1);
        scene.add(endDoor.group);
        runData.endDoor = endDoor;

        const endLight = new THREE.PointLight('#ffffff', 10, 15, 1);
        endLight.position.set(0, 2, L/2 - 2); scene.add(endLight);

        players.run = { position: new THREE.Vector3(0, 1.6, -L/2 + 2), yaw: 0, pitch: 0 };
        camera.position.copy(players.run.position);
        camera.rotation.y = players.run.yaw; camera.rotation.x = players.run.pitch;

        document.getElementById('info-bar').style.display = 'block';
        document.getElementById('level-tag').textContent = '后室 · Level !';

        runData.time = 0; runData.distance = 0;
        clocks.run = new THREE.Clock();
        showTitle('Level—!');
        animateRun();
    }
    function animateRun() {
        if (currentPhase !== 'run') return;
        requestAnimationFrame(animateRun);
        if (document.hidden) return;
        const delta = Math.min(clocks.run.getDelta(), 0.1);
        const time = clocks.run.getElapsedTime();
        const player = players.run;
        const camera = cameras.run;

        runData.time += delta;

        let moveX = joystickDelta.x, moveZ = joystickDelta.z;
        if (keys['w'] || keys['arrowup']) moveZ = Math.max(moveZ, 0.85);
        if (keys['s'] || keys['arrowdown']) moveZ = Math.min(moveZ, -0.7);
        if (keys['a'] || keys['arrowleft']) moveX = Math.min(moveX, -0.8);
        if (keys['d'] || keys['arrowright']) moveX = Math.max(moveX, 0.8);
        const mag = Math.sqrt(moveX*moveX + moveZ*moveZ);
        if (mag > 1.0) { moveX /= mag; moveZ /= mag; }

        moveZ = Math.max(moveZ, 0.4);

        if (lookDelta.x !== 0 || lookDelta.y !== 0) {
            player.yaw -= lookDelta.x * 0.003; player.pitch -= lookDelta.y * 0.0025;
            player.pitch = Math.max(-0.55, Math.min(0.4, player.pitch));
            lookDelta.x = 0; lookDelta.y = 0;
        }
        if (!mouseLookActive && lookTouchId === null) { lookDelta.x *= 0.85; lookDelta.y *= 0.85; if (Math.abs(lookDelta.x) < 0.01) lookDelta.x = 0; if (Math.abs(lookDelta.y) < 0.01) lookDelta.y = 0; }

        const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
        const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
        const speed = 5.0;
        player.position.x += (fx*moveZ + rx*moveX) * speed * delta;
        player.position.z += (fz*moveZ + rz*moveX) * speed * delta;
        player.position.x = Math.max(-2.2, Math.min(2.2, player.position.x));

        camera.position.copy(player.position); camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;
        camera.position.y += Math.sin(time*12)*0.02;
        camera.rotation.z = Math.sin(time*8)*0.01;

        if (player.position.z > 48) {
            transitionToEnding();
            return;
        }

        const chaseProgress = (player.position.z + 48) / 96;
        const chaseIntensity = 0.1 + chaseProgress * 0.3;

        renderer.setRenderTarget(renderTarget); renderer.render(scenes.run, camera); renderer.setRenderTarget(null);
        postMaterial.uniforms.uTime.value = time;
        postMaterial.uniforms.uDistortion.value = 0.1 + chaseIntensity * 0.2 + Math.sin(time*10)*0.05;
        postMaterial.uniforms.uRGBShift.value = 0.1 + chaseIntensity * 0.3;
        postMaterial.uniforms.uFlicker.value = 0.2 + Math.sin(time*5)*0.1 + Math.random()*0.1;
        renderer.render(postScene, postCamera);
        perfMonitor.tick();
    }

    // ==================== 结局 ====================
    function transitionToEnding() {
        currentPhase = 'ending';
        document.getElementById('info-bar').style.display = 'none';
        document.getElementById('ending-screen').style.display = 'flex';
    }

    // ==================== 启动 ====================
    window.addEventListener('load', function() {
        const ls = document.getElementById('loading-screen');
        if (ls) { ls.style.opacity = '0'; ls.style.transition = 'opacity 0.5s'; setTimeout(() => ls.remove(), 500); }
        initRenderer();
        initTunnel();
        animateTunnel();
        updateTime();
    });
    </script>
</body>
</html>
